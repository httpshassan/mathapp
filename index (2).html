<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Math App">
<meta name="theme-color" content="#0B0D11">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mental Math</title>
<style>
:root{
  --bg:#0B0D11;
  --surface:#151922;
  --surface-2:#1D222D;
  --line:#272D3A;
  --text:#E9ECF2;
  --muted:#8B94A7;
  --mint:#5EE9B5;
  --violet:#9D8CFF;
  --amber:#FFC24B;
  --rose:#FF6B7A;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  position:fixed;inset:0;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
.app{display:flex;flex-direction:column;height:100%}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--safe-t) + 18px) 18px 24px}
.page{display:none;flex-direction:column;flex:1;min-height:0}
.page.on{display:flex;animation:pageIn .22s cubic-bezier(.22,.7,.3,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page.on{animation:none}}
.page.on{display:flex}

/* ---- headers ---- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
h1{font-size:30px;letter-spacing:-.02em;margin:6px 0 20px;font-weight:650}
h2{font-size:18px;letter-spacing:-.01em;margin:26px 0 12px;font-weight:600}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:15px;margin-bottom:14px}

/* ---- cards ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;
  display:flex;flex-direction:column;gap:8px;text-align:left;transition:transform .12s,border-color .12s}
.card:active{transform:scale(.975);border-color:var(--mint)}
.card.wide{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between}
.card .glyph{font-family:var(--mono);font-size:22px;color:var(--mint)}
.card .name{font-weight:600;font-size:16px}
.card .sub{font-size:12.5px;color:var(--muted);line-height:1.45}
.chev{color:var(--muted);font-size:20px}

.tint-add .glyph{color:var(--mint)}
.tint-sub .glyph{color:var(--violet)}
.tint-mul .glyph{color:var(--amber)}
.tint-div .glyph{color:#6FD3FF}
.tint-pct .glyph{color:var(--rose)}

/* ---- stats strip ---- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px;text-align:center}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:600}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.04em}

/* ---- level rows ---- */
.row{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:15px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.row:active{border-color:var(--mint)}
.row .l{display:flex;flex-direction:column;gap:3px}
.row .t{font-weight:560;font-size:15.5px}
.row .d{font-size:12.5px;color:var(--muted)}
.pill{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);
  border-radius:999px;padding:4px 9px;white-space:nowrap}

/* ---- quiz ---- */
#quiz{padding:calc(var(--safe-t) + 10px) 0 0}
.qbar{display:flex;align-items:center;gap:12px;padding:0 16px 10px}
.qbar button{color:var(--muted);font-size:20px;padding:6px}
.track{flex:1;height:4px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--mint);width:0;transition:width .25s}
.count{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.qbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px;gap:18px}
.qlabel{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center}
.prompt{font-family:var(--mono);font-size:clamp(30px,9vw,46px);font-weight:600;letter-spacing:-.01em;text-align:center;line-height:1.25}
.prompt small{display:block;font-family:var(--sans);font-size:14px;font-weight:400;color:var(--muted);line-height:1.5;margin-top:10px;max-width:22em}
.entry{font-family:var(--mono);font-size:34px;min-height:46px;color:var(--mint);letter-spacing:.02em}
.entry.empty{color:var(--line)}
.unit{font-size:18px;color:var(--muted);font-family:var(--mono)}

.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 10px calc(var(--safe-b) + 10px)}
.key{background:var(--surface);border:1px solid var(--line);border-radius:14px;height:58px;
  font-family:var(--mono);font-size:22px;display:flex;align-items:center;justify-content:center}
.key:active{background:var(--surface-2)}
.key.go{background:var(--mint);color:#07120D;border-color:var(--mint);font-weight:700}
.key.sm{font-size:15px;color:var(--muted)}
.key.zero{grid-column:span 2}

/* ---- results ---- */
.score{font-family:var(--mono);font-size:56px;font-weight:650;line-height:1}
.rlist{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.ritem{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-left:3px solid var(--mint);border-radius:12px;padding:11px 13px;font-family:var(--mono);font-size:14px}
.ritem.bad{border-left-color:var(--rose)}
.ritem.skip{border-left-color:var(--muted)}
.ritem .yours{font-size:12px;color:var(--muted)}
.btn{display:block;width:100%;background:var(--mint);color:#07120D;font-weight:650;border-radius:16px;padding:16px;text-align:center;margin-top:18px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}

/* ---- hacks ---- */
.hack-body{font-size:15px;line-height:1.62;color:#C9D0DD}
.hack-body p{margin:12px 0}
.steps{counter-reset:s;margin:14px 0;display:flex;flex-direction:column;gap:10px}
.steps li{list-style:none;counter-increment:s;position:relative;padding-left:34px;font-size:15px;line-height:1.55}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:23px;height:23px;border-radius:7px;
  background:var(--surface-2);color:var(--mint);font-family:var(--mono);font-size:12px;display:flex;align-items:center;justify-content:center}
.example{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0;
  font-family:var(--mono);font-size:15px;line-height:1.75;color:#C9D0DD;white-space:pre-line}
.example b{color:var(--mint);font-weight:600}

/* ---- tab bar ---- */
.tabs{display:flex;flex-shrink:0;background:rgba(11,13,17,.92);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding:8px 4px calc(var(--safe-b) + 6px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);padding:5px 0}
.tab .ic{font-family:var(--mono);font-size:17px;line-height:1}
.tab span{font-size:10.5px;letter-spacing:.02em}
.tab.on{color:var(--mint)}
.tab .ic{transition:transform .18s cubic-bezier(.2,1.5,.4,1)}
.tab.on .ic{transform:translateY(-2px) scale(1.14)}
.tab:active .ic{transform:scale(.86)}
.key{transition:transform .06s,background .06s}
.key.down{background:var(--surface-2);transform:scale(.94)}
.key.go.down{background:#3FD9A2}
.entry{transition:transform .1s}
.entry.pop{transform:scale(1.08)}
.hidebar .tabs{display:none}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- PRACTICE -->
  <section class="page on" id="p-practice">
    <div class="scroll">
      <div class="eyebrow">Drill the basics</div>
      <h1>Practice</h1>
      <div class="grid" id="catGrid"></div>
    </div>
  </section>

  <!-- CATEGORY DETAIL -->
  <section class="page" id="p-cat">
    <div class="scroll">
      <button class="back" onclick="goTab('practice')">‹ Back</button>
      <div class="eyebrow" id="catEyebrow"></div>
      <h1 id="catTitle"></h1>
      <div class="stats" id="catStats"></div>
      <h2>Choose a level</h2>
      <div id="catLevels"></div>
    </div>
  </section>

  <!-- HACKS -->
  <section class="page" id="p-hacks">
    <div class="scroll">
      <div class="eyebrow">Shortcuts worth memorizing</div>
      <h1>Math Hacks</h1>
      <div id="hackList"></div>
    </div>
  </section>

  <!-- HACK DETAIL -->
  <section class="page" id="p-hack">
    <div class="scroll">
      <button class="back" onclick="goTab('hacks')">‹ Back</button>
      <div class="eyebrow" id="hackEyebrow"></div>
      <h1 id="hackTitle"></h1>
      <div class="hack-body" id="hackBody"></div>
      <button class="btn" id="hackStart">Practice this hack</button>
    </div>
  </section>

  <!-- CASE MATH -->
  <section class="page" id="p-case">
    <div class="scroll">
      <div class="eyebrow">Interview-style arithmetic</div>
      <h1>Case Math</h1>
      <div id="caseList"></div>
    </div>
  </section>

  <!-- PROGRESS -->
  <section class="page" id="p-progress">
    <div class="scroll">
      <div class="eyebrow">All time</div>
      <h1>Progress</h1>
      <div class="stats" id="progTop"></div>
      <h2>By category</h2>
      <div id="progList"></div>
      <button class="btn ghost" onclick="resetAll()">Reset all stats</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section class="page" id="p-quiz">
    <div id="quiz" style="display:flex;flex-direction:column;height:100%">
      <div class="qbar">
        <button onclick="quitQuiz()">✕</button>
        <div class="track"><div class="fill" id="qFill"></div></div>
        <div class="count" id="qCount"></div>
        <button onclick="skipQ()" title="Skip">⏭</button>
      </div>
      <div class="qbody">
        <div class="qlabel" id="qLabel"></div>
        <div class="prompt" id="qPrompt"></div>
        <div class="entry empty" id="qEntry">–</div>
      </div>
      <div class="pad">
        <button class="key" data-k="7">7</button>
        <button class="key" data-k="8">8</button>
        <button class="key" data-k="9">9</button>
        <button class="key sm" data-k="CLR">CLR</button>
        <button class="key" data-k="4">4</button>
        <button class="key" data-k="5">5</button>
        <button class="key" data-k="6">6</button>
        <button class="key sm" data-k="DEL">⌫</button>
        <button class="key" data-k="1">1</button>
        <button class="key" data-k="2">2</button>
        <button class="key" data-k="3">3</button>
        <button class="key sm" data-k="-">±</button>
        <button class="key zero" data-k="0">0</button>
        <button class="key" data-k=".">.</button>
        <button class="key go" data-k="GO">➤</button>
      </div>
    </div>
  </section>

  <!-- RESULTS -->
  <section class="page" id="p-results">
    <div class="scroll">
      <div class="eyebrow" id="rEyebrow"></div>
      <div class="score" id="rScore"></div>
      <div class="stats" style="margin-top:18px" id="rStats"></div>
      <button class="btn" onclick="restartSame()">Run another 30</button>
      <button class="btn ghost" onclick="doneResults()">Back to menu</button>
      <h2>Every question</h2>
      <div class="rlist" id="rList"></div>
    </div>
  </section>

  <nav class="tabs" id="tabs"></nav>
</div>

<script>
/* ============ storage (degrades gracefully) ============ */
const DB = (()=>{ let m={}; try{ m=JSON.parse(localStorage.getItem('mm')||'{}'); }catch(e){}
  return { d:m, save(){ try{ localStorage.setItem('mm',JSON.stringify(m)); }catch(e){} } };})();
DB.d.stats = DB.d.stats || {};
DB.d.days  = DB.d.days  || [];

function today(){ return new Date().toISOString().slice(0,10); }
function markDay(){ const t=today(); if(!DB.d.days.includes(t)){ DB.d.days.push(t); DB.d.days=DB.d.days.slice(-400);} }
function dayStreak(){
  const set=new Set(DB.d.days); const d=new Date();
  if(!set.has(d.toISOString().slice(0,10))) d.setDate(d.getDate()-1);
  let n=0;
  while(set.has(d.toISOString().slice(0,10))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function record(key,correct,ms){
  const s = DB.d.stats[key] = DB.d.stats[key] || {n:0,c:0,ms:0};
  s.n++; if(correct) s.c++; s.ms+=ms; DB.save();
}
function statOf(key){ return DB.d.stats[key] || {n:0,c:0,ms:0}; }

/* ============ random helpers (anti-streak) ============ */
const R = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick = a=>a[Math.floor(Math.random()*a.length)];
// "fresh" avoids repeating recently used values so you don't get five ×2 in a row
function fresh(gen, memory, span){
  span = span || 4; let v;
  for(let i=0;i<24;i++){ v=gen(); if(!memory.includes(v)) break; }
  memory.push(v); if(memory.length>span) memory.shift();
  return v;
}
const digits = d => R(Math.pow(10,d-1), Math.pow(10,d)-1);
// operand generator that never yields 0 or 1
function operand(d, mem){
  return fresh(()=>{ let v = d===1 ? R(2,9) : digits(d); return v<2?2:v; }, mem);
}
const gcd=(a,b)=>b?gcd(b,a%b):a;
const round = (x,p=2)=>Math.round(x*Math.pow(10,p))/Math.pow(10,p);
const fmt = n => Number.isInteger(n) ? n.toLocaleString('en-US') : round(n,2).toString();

/* ============ question generators ============ */
// each returns {label, text, answer, unit, note}
const M = {}; // per-level memories

function mem(k){ return (M[k] = M[k] || {a:[],b:[]}); }

const GEN = {
  add:(d1,d2,key)=>{ const m=mem(key); const a=operand(d1,m.a), b=operand(d2,m.b);
    return {label:`Addition · ${d1} digit + ${d2} digit`, text:`${fmt(a)} + ${fmt(b)}`, answer:a+b}; },

  sub:(d1,d2,key)=>{ const m=mem(key); let a=operand(d1,m.a), b=operand(d2,m.b);
    if(b>a){ const t=a; a=b; b=t; } if(a===b) a+=R(2,9);
    return {label:`Subtraction · ${d1} digit − ${d2} digit`, text:`${fmt(a)} − ${fmt(b)}`, answer:a-b}; },

  mul:(d1,d2,key)=>{ const m=mem(key); const a=operand(d1,m.a), b=operand(d2,m.b);
    return {label:`Multiplication · ${d1} digit × ${d2} digit`, text:`${fmt(a)} × ${fmt(b)}`, answer:a*b}; },

  div:(dq,dd,key,minN)=>{ const m=mem(key); let divisor,q,n,tries=0;
    do{ divisor=operand(dd,m.b); q=operand(dq,m.a); n=divisor*q; tries++; }
    while(minN && n<minN && tries<40);
    return {label:`Division · ${String(n).length} digit ÷ ${dd} digit, exact`, text:`${fmt(n)} ÷ ${fmt(divisor)}`, answer:q}; },

  // every percent is a whole number, and the base is chosen so the answer lands clean
  pctClean:(key, lo, hi, label)=>{
    const m=mem(key);
    const p=fresh(()=>pick([5,10,15,20,25,30,40,50,60,75,80,90]), m.a, 6);
    const step=100/gcd(p,100);                       // base must be a multiple of this
    const base=fresh(()=>{
      const k=R(Math.ceil(lo/step), Math.floor(hi/step));
      return k*step;
    }, m.b, 5);
    return {label:label, text:`${p}% of ${fmt(base)}`, answer:base*p/100};
  },

  pctRound:(key)=>{
    const m=mem(key);
    const p=fresh(()=>pick([5,10,15,20,25,30,40,50,60,75,80,90]), m.a, 6);
    const unit=pick([1000,10000,100000,1000000]);
    const base=fresh(()=>R(2,99)*unit, m.b, 5);
    return {label:'Percentages · large round numbers', text:`${p}% of ${fmt(base)}`, answer:base*p/100};
  },

  pctWhat:(key)=>{ const m=mem(key);
    const whole=fresh(()=>pick([40,50,80,200,250,400,500,800,1200,1600,2000,2500,4000,5000]), m.b, 5);
    const p=fresh(()=>pick([5,10,15,20,25,30,40,50,60,75,80]), m.a, 6);
    return {label:'Percentages · what percent', text:`${fmt(whole*p/100)} is what % of ${fmt(whole)}`, answer:p, unit:'%'}; },

  pctReverse:(key)=>{ const m=mem(key);
    const p=fresh(()=>pick([5,10,20,25,40,50,60,75,80]), m.a, 6);
    const whole=fresh(()=>pick([200,400,500,800,1000,1500,2000,2500,4000,5000,20000]), m.b, 5);
    return {label:'Percentages · find the whole', text:`${fmt(whole*p/100)} is ${p}% of what`, answer:whole}; },

  pctChange:(key)=>{ const m=mem(key);
    const p=fresh(()=>pick([5,10,15,20,25,30,40,50,60,75]), m.a, 6);
    const step=100/gcd(p,100);
    const base=fresh(()=>R(2,50)*step*pick([1,2,10]), m.b, 5);
    const up=Math.random()<.5;
    return {label:`Percentages · ${up?'increase':'decrease'}`, text:`${fmt(base)} ${up?'up':'down'} ${p}%`,
      answer: Math.round(base*(up?100+p:100-p))/100}; },

  pctPoints:(key)=>{ const m=mem(key);
    const base=fresh(()=>pick([200,400,500,800,1000,2000,2500,4000,5000]), m.b, 5);
    const a=fresh(()=>pick([10,15,20,25,30,40,50]), m.a, 6);
    const b=pick([5,10,15,20,25].filter(x=>x!==a)) || 5;
    const hi=Math.max(a,b), lo=Math.min(a,b);
    return {label:'Percentages · difference between two', text:`${hi}% of ${fmt(base)} minus ${lo}% of ${fmt(base)}`,
      answer:base*(hi-lo)/100}; },
};

/* ============ categories ============ */
const CATS = [
  {id:'mixed', glyph:'±×÷', name:'Mixed Practice', sub:'Everything, shuffled', tint:'tint-add',
   levels:[
     {id:'mixed-easy', t:'Warm-up', d:'2 digit work, all four operations', pill:'easy'},
     {id:'mixed-mid',  t:'Standard', d:'2–3 digit, plus percentages', pill:'medium'},
     {id:'mixed-hard', t:'Ruthless', d:'3 digit, division and % included', pill:'hard'},
   ]},
  {id:'add', glyph:'7+4', name:'Addition', sub:'Carry chains and running totals', tint:'tint-add',
   levels:[
     {id:'add-21', t:'2 digit + 1 digit', d:'e.g. 47 + 8', pill:'warm-up'},
     {id:'add-22', t:'2 digit + 2 digit', d:'e.g. 47 + 68', pill:'beginner'},
     {id:'add-32', t:'3 digit + 2 digit', d:'e.g. 486 + 57', pill:'intermediate'},
     {id:'add-33', t:'3 digit + 3 digit', d:'e.g. 674 + 289', pill:'advanced'},
     {id:'add-44', t:'4 digit + 4 digit', d:'e.g. 3,482 + 6,719', pill:'expert'},
   ]},
  {id:'sub', glyph:'9−4', name:'Subtraction', sub:'Borrowing without slowing down', tint:'tint-sub',
   levels:[
     {id:'sub-21', t:'2 digit − 1 digit', d:'e.g. 42 − 7', pill:'warm-up'},
     {id:'sub-22', t:'2 digit − 2 digit', d:'e.g. 83 − 47', pill:'beginner'},
     {id:'sub-32', t:'3 digit − 2 digit', d:'e.g. 512 − 68', pill:'intermediate'},
     {id:'sub-33', t:'3 digit − 3 digit', d:'e.g. 804 − 379', pill:'advanced'},
     {id:'sub-44', t:'4 digit − 4 digit', d:'e.g. 7,214 − 3,689', pill:'expert'},
   ]},
  {id:'mul', glyph:'7×6', name:'Multiplication', sub:'Tables through full 3 × 3', tint:'tint-mul',
   levels:[
     {id:'mul-11', t:'1 digit × 1 digit', d:'The tables, 2 through 9', pill:'beginner'},
     {id:'mul-21', t:'2 digit × 1 digit', d:'e.g. 47 × 6', pill:'beginner'},
     {id:'mul-22', t:'2 digit × 2 digit', d:'e.g. 34 × 27', pill:'intermediate'},
     {id:'mul-31', t:'3 digit × 1 digit', d:'e.g. 428 × 7', pill:'intermediate'},
     {id:'mul-32', t:'3 digit × 2 digit', d:'e.g. 316 × 24', pill:'advanced'},
     {id:'mul-33', t:'3 digit × 3 digit', d:'e.g. 214 × 386', pill:'expert'},
   ]},
  {id:'div', glyph:'42÷6', name:'Division', sub:'Always exact, never by 0 or 1', tint:'tint-div',
   levels:[
     {id:'div-21', t:'2 digit ÷ 1 digit', d:'e.g. 84 ÷ 7', pill:'beginner'},
     {id:'div-31', t:'3 digit ÷ 1 digit', d:'e.g. 432 ÷ 6', pill:'intermediate'},
     {id:'div-32', t:'3 digit ÷ 2 digit', d:'e.g. 736 ÷ 23', pill:'advanced'},
     {id:'div-42', t:'4 digit ÷ 2 digit', d:'e.g. 5,templates', pill:'expert'},
   ]},
  {id:'pct', glyph:'15%', name:'Percentages', sub:'Whole percents, clean numbers', tint:'tint-pct',

     {id:'pct-chg', t:'Increase and decrease', d:'e.g. 800 up 25%', pill:'advanced'},
     {id:'pct-diff', t:'Difference between two percents', d:'e.g. 30% of 2,000 minus 10% of 2,000', pill:'advanced'},
     {id:'pct-all', t:'All types, shuffled', d:'Every percentage drill above', pill:'expert'},
   ]},
];
CATS.find(c=>c.id==='div').levels[3].d='e.g. 5,376 ÷ 24';

function buildQ(levelId){
  switch(levelId){
    case 'add-21': return GEN.add(2,1,levelId);
    case 'add-22': return GEN.add(2,2,levelId);
    case 'add-32': return GEN.add(3,2,levelId);
    case 'add-33': return GEN.add(3,3,levelId);
    case 'add-44': return GEN.add(4,4,levelId);
    case 'sub-21': return GEN.sub(2,1,levelId);
    case 'sub-22': return GEN.sub(2,2,levelId);
    case 'sub-32': return GEN.sub(3,2,levelId);
    case 'sub-33': return GEN.sub(3,3,levelId);
    case 'sub-44': return GEN.sub(4,4,levelId);
    case 'mul-11': return GEN.mul(1,1,levelId);
    case 'mul-21': return GEN.mul(2,1,levelId);
    case 'mul-22': return GEN.mul(2,2,levelId);
    case 'mul-31': return GEN.mul(3,1,levelId);
    case 'mul-32': return GEN.mul(3,2,levelId);
    case 'mul-33': return GEN.mul(3,3,levelId);
    case 'div-21': return GEN.div(1,1,levelId,10);
    case 'div-31': return GEN.div(2,1,levelId,100);
    case 'div-32': return GEN.div(1,2,levelId,100);
    case 'div-42': return GEN.div(2,2,levelId,1000);
    case 'pct-2': return GEN.pctClean(levelId, 10, 99, 'Percentages · 2 digit base');
    case 'pct-3': return GEN.pctClean(levelId, 100, 999, 'Percentages · 3 digit base');
    case 'pct-big': return GEN.pctRound(levelId);
    case 'pct-what': return GEN.pctWhat(levelId);
    case 'pct-rev': return GEN.pctReverse(levelId);
    case 'pct-chg': return GEN.pctChange(levelId);
    case 'pct-diff': return GEN.pctPoints(levelId);
    case 'pct-all': return buildQ(pick(['pct-2','pct-3','pct-big','pct-what','pct-rev','pct-chg','pct-diff']));
    case 'mixed-easy': return buildQ(pick(['add-21','add-22','sub-21','sub-22','mul-21','div-21','mul-11','pct-2']));
    case 'mixed-mid':  return buildQ(pick(['add-32','sub-32','mul-22','div-31','pct-2','pct-3','pct-what']));
    case 'mixed-hard': return buildQ(pick(['add-33','sub-33','mul-32','mul-33','div-32','div-42','pct-chg','pct-what','pct-big','pct-rev']));
    default:
      if(HACKS[levelId]) return HACKS[levelId].gen();
      if(CASES[levelId]) return CASES[levelId].gen();
      return GEN.mul(2,2,'fallback');
  }
}

/* ============ quiz engine ============ */
const TOTAL=30;
let Q={list:[],i:0,entry:'',t0:0,key:'',title:'',log:[],locked:false};

function startQuiz(levelId,title){
  Q={list:[],i:0,entry:'',t0:0,key:levelId,title:title,log:[],locked:false};
  const seen=[];
  while(Q.list.length<TOTAL){
    const q=buildQ(levelId);
    if(seen.includes(q.text) && Q.list.length<TOTAL-2) continue;   // no duplicate prompts
    seen.push(q.text); Q.list.push(q);
  }
  show('quiz',currentTab);
  renderQ();
}
function renderQ(){
  const q=Q.list[Q.i];
  $('qCount').textContent=`${Q.i+1} of ${TOTAL}`;
  $('qFill').style.width=((Q.i)/TOTAL*100)+'%';
  $('qLabel').textContent=q.label;
  $('qPrompt').innerHTML=q.text + (q.unit?` <span class="unit">${q.unit==='%'?'%':'($M)'}</span>`:'') +
    (q.note?`<small>${q.note}</small>`:'');
  Q.entry=''; Q.locked=false; paint(); Q.t0=Date.now();
}
function paint(pop){
  const e=$('qEntry');
  e.textContent = Q.entry===''?'\u2013':Q.entry;
  e.classList.toggle('empty', Q.entry==='');
  if(pop){ e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop'); }
}
function tap(ch){
  if(Q.locked) return;
  if(ch==='-'){ Q.entry = Q.entry.startsWith('-') ? Q.entry.slice(1) : '-'+Q.entry; paint(1); return; }
  if(ch==='.' && Q.entry.includes('.')) return;
  if(Q.entry.replace('-','').replace('.','').length>=9) return;
  Q.entry+=ch; paint(1);
  autoAdvance();
}
function back(){ if(Q.locked) return; Q.entry=Q.entry.slice(0,-1); paint(); }
function clearEntry(){ if(Q.locked) return; Q.entry=''; paint(); }

// as soon as what you have typed IS the answer, move on - no button press needed
function autoAdvance(){
  const q=Q.list[Q.i];
  if(Q.entry===''||Q.entry==='-'||Q.entry==='.') return;
  if(Q.entry.endsWith('.')) return;
  const v=parseFloat(Q.entry);
  if(!isNaN(v) && Math.abs(v-q.answer)<0.005){ Q.locked=true; commit(false); }
}

/* one delegated pointerdown handler - fires on touch-down, so rapid taps all land */
(function(){
  const pad=document.querySelector('.pad');
  const act=el=>{
    const k=el.dataset.k;
    if(k==='CLR') clearEntry();
    else if(k==='DEL') back();
    else if(k==='GO') submit();
    else tap(k);
  };
  const down=e=>{
    const el=e.target.closest('[data-k]'); if(!el) return;
    e.preventDefault();
    el.classList.add('down');
    act(el);
  };
  const up=()=>pad.querySelectorAll('.down').forEach(el=>el.classList.remove('down'));
  if(window.PointerEvent){ pad.addEventListener('pointerdown',down,{passive:false}); }
  else { pad.addEventListener('touchstart',down,{passive:false}); pad.addEventListener('mousedown',down); }
  ['pointerup','pointercancel','pointerleave','touchend','touchcancel','mouseup'].forEach(ev=>pad.addEventListener(ev,up));
})();

function commit(skipped){
  const q=Q.list[Q.i], ms=Date.now()-Q.t0;
  const val = skipped ? null : parseFloat(Q.entry);
  const correct = !skipped && Math.abs(val-q.answer) < 0.005;
  Q.log.push({q, given: skipped?null:Q.entry, correct, skipped, ms});
  record(Q.key, correct, ms);
  if(navigator.vibrate) navigator.vibrate(8);
  Q.i++;
  if(Q.i>=TOTAL){ markDay(); DB.save(); finish(); } else renderQ();
}
function submit(){ if(Q.locked) return; if(Q.entry===''||Q.entry==='-'||Q.entry==='.') return; Q.locked=true; commit(false); }
function skipQ(){ if(Q.locked) return; Q.locked=true; commit(true); }
function quitQuiz(){ if(confirm('End this set? Progress in it is lost.')) goTab(currentTab); }

function finish(){
  const right=Q.log.filter(l=>l.correct).length;
  const avg=(Q.log.reduce((a,l)=>a+l.ms,0)/TOTAL/1000).toFixed(1);
  const skipped=Q.log.filter(l=>l.skipped).length;
  $('rEyebrow').textContent=Q.title+' · set of 30';
  $('rScore').textContent=`${right}/30`;
  $('rStats').innerHTML=`
    <div class="stat"><b>${Math.round(right/TOTAL*100)}%</b><span>accuracy</span></div>
    <div class="stat"><b>${avg}s</b><span>avg time</span></div>
    <div class="stat"><b>${skipped}</b><span>skipped</span></div>`;
  $('rList').innerHTML=Q.log.map((l,i)=>`
    <div class="ritem ${l.correct?'':(l.skipped?'skip':'bad')}">
      <div>${i+1}. ${l.q.text}${l.q.unit==='%'?' (%)':''}</div>
      <div style="text-align:right">
        <div>${fmt(l.q.answer)}</div>
        ${l.correct?'':`<div class="yours">${l.skipped?'skipped':'you: '+l.given}</div>`}
      </div></div>`).join('');
  show('results',currentTab);
}
function restartSame(){ startQuiz(Q.key,Q.title); }
function doneResults(){ goTab(currentTab); }

/* physical keyboard, for desktop testing */
document.addEventListener('keydown',e=>{
  if(!$('p-quiz').classList.contains('on')) return;
  if(/^[0-9]$/.test(e.key)) tap(e.key);
  else if(e.key==='.') tap('.');
  else if(e.key==='Backspace') back();
  else if(e.key==='Enter') submit();
  else if(e.key==='Escape') clearEntry();
});

goTab('practice');
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
